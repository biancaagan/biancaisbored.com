    <div class="fade-text">
        <p id="demo"></p>

        <canvas id="answerCanvas" width="800" height="140"></canvas>

    <div class="answer-container">
            <textarea class="input-text" id="answerTextArea" placeholder="...?"></textarea>

            <button class="submit-button" id="answerButton">answer</button>
            <button class="submit-button" id="refreshButton">refresh</button>
            
            <br><br>

    <div class="word-mode-container">
        <form id="word-mode-form">
                <p>Select mode:</p>
                <input type="radio" id="mode1" name="choice" value="mode1" checked>
                <label for="mode1">Guess the Dutch word</label>
                <br>
                <input type="radio" id="mode2" name="choice" value="mode2" unchecked>
                <label for="mode2">Guess the English word</label>
